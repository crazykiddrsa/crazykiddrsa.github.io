<!DOCTYPE html>
<html lang="en">
<head>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7447247941010903"
     crossorigin="anonymous"></script>

<meta charset="UTF-8">
<title>SbheneCart</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SbheneCart</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#000;color:white;overflow-x:hidden;scroll-behavior:smooth;}
header{background:#000;padding:15px 40px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #00ff88;}
header h1{color:#00ff88;text-shadow:0 0 15px #00ff88;}
.cart-container{position:relative;cursor:pointer;padding:8px;}
.cart-count{position:absolute;top:-8px;right:-10px;background:#00ff88;color:black;font-size:12px;padding:2px 6px;border-radius:50%;font-weight:bold;transition:0.3s;transform-origin:center;}
.cart-count.pop{animation:popCart 0.4s ease;}
@keyframes popCart{0%{transform:scale(1);}50%{transform:scale(1.6);}100%{transform:scale(1);}}
.menu-btn{font-size:28px;cursor:pointer;margin-left:20px;}
nav{position:absolute;top:60px;right:0;background:#111;width:200px;display:none;flex-direction:column;border-left:2px solid #00ff88;}
nav a{padding:15px;color:#00ff88;text-decoration:none;border-bottom:1px solid #00ff88;cursor:pointer;}
nav a:hover{background:#00ff88;color:black;}
.cart-panel{position:fixed;top:0;right:0;width:350px;height:100%;background:#111;border-left:2px solid #00ff88;z-index:20;display:flex;flex-direction:column;padding:20px;
transform:translateX(100%) scale(0.95);opacity:0;transition:transform 1.2s cubic-bezier(0.68,-0.6,0.32,1.6),opacity 1s ease,box-shadow 0.8s ease;box-shadow:-10px 0 30px rgba(0,255,136,0);}
.cart-panel.open{transform:translateX(0) scale(1);opacity:1;box-shadow:-10px 0 50px rgba(0,255,136,0.5);}
.cart-panel h3{color:#00ff88;text-align:center;margin-bottom:15px;}
.cart-item{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:14px;}
.cart-item button{background:#00ff88;border:none;padding:3px 8px;margin:0 4px;cursor:pointer;}
.cart-total{font-weight:bold;color:#00ff88;font-size:16px;text-align:center;margin-top:10px;}
.btn{margin-top:10px;padding:12px 20px;border-radius:25px;border:none;background:#00ff88;color:black;font-weight:bold;cursor:pointer;transition:0.3s;}
.btn:hover{background:white;}
.section{display:none;padding:40px 20px;}
.active{display:block;}
.categories{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;overflow-y:auto;scroll-behavior:smooth;}
.categories::-webkit-scrollbar{width:8px;}
.categories::-webkit-scrollbar-thumb{background:#00ff88;border-radius:4px;}
.categories::-webkit-scrollbar-track{background: rgba(255,255,255,0.05);}
.card{background:#111;padding:15px;border-radius:10px;border:1px solid #00ff88;text-align:center;transition:0.3s;position:relative;}
.card:hover{transform:translateY(-5px);box-shadow:0 0 25px #00ff88;}
.card img{width:100%;height:180px;object-fit:cover;border-radius:10px;margin-bottom:10px;transition:0.3s;}
.card img:hover{transform:scale(1.05);box-shadow:0 0 20px #00ff88;}
.back-btn{margin-bottom:20px;}
.flying-img{position:absolute;width:60px;height:60px;border-radius:50%;pointer-events:none;z-index:1000;transition:transform 1.5s cubic-bezier(0.68,-0.55,0.27,1.55),opacity 1.5s;}
.checkout-form{display:none;margin-top:15px;}
.checkout-form input{width:100%;padding:10px;margin-bottom:10px;border:none;border-radius:5px;}
.card.new-item::after{content:"NEW";position:absolute;top:10px;right:10px;background:#ff00ff;color:black;font-size:12px;font-weight:bold;padding:2px 6px;border-radius:4px;text-transform:uppercase;}
@media(max-width:600px){.cart-panel{width:100%;}}
</style>
</head>
<body>

<header>
<h1>SbheneCart</h1>
<div>
<button class="btn" onclick="window.location.href='admin.html'">Admin Login</button>
<span class="menu-btn" onclick="toggleMenu()">☰</span>
<nav id="menu">
<a onclick="showSection('signup-login')">Login</a>
<a onclick="showSection('track-order-section')">Track Orders</a>
</nav>
<span class="cart-container" id="cart-icon">🛒 <span class="cart-count" id="cart-count">0</span></span>
</div>
</header>

<!-- HOME -->
<section id="home" class="section active">
<h2 style="color:#00ff88;margin-bottom:20px;">Categories</h2>
<div class="categories" id="categories-container"></div>
</section>

<!-- CATEGORY ITEMS -->
<section id="category-items" class="section">
<button class="btn back-btn" onclick="showSection('home')">⬅ Back</button>
<h2 style="color:#00ff88;margin-bottom:20px;" id="category-title"></h2>
<div class="categories" id="items-container"></div>
</section>

<!-- PILLS SHOP -->
<section id="pills-shop" class="section">
<button class="btn back-btn" onclick="showCategoryItems('Products')">⬅ Back</button>
<h2 style="color:#00ff88;margin-bottom:20px;">Shop Pills</h2>
<div class="categories" id="pills-container"></div>
</section>

<!-- PERFUME SHOP -->
<section id="perfume-shop" class="section">
<button class="btn back-btn" onclick="showCategoryItems('Products')">⬅ Back</button>
<h2 style="color:#00ff88;margin-bottom:20px;">Shop Perfumes</h2>
<div class="categories" id="perfume-container"></div>
</section>

<!-- LOGIN & SIGNUP -->
<section id="signup-login" class="section">
<h2>Login / Signup</h2>
<input id="login-username" placeholder="Username">
<input id="login-password" type="password" placeholder="Password">
<button class="btn" onclick="loginUser()">Login</button>
<hr style="margin:20px 0;border-color:#00ff88;">
<input id="signup-username" placeholder="Username">
<input id="signup-email" type="email" placeholder="Email">
<input id="signup-password" type="password" placeholder="Password">
<button class="btn" onclick="startSignup()">Sign Up</button>
<div id="otp-verification" style="display:none;margin-top:10px;">
<p>Enter OTP sent to email:</p>
<input id="otp-input" placeholder="Enter OTP">
<button class="btn" onclick="verifyOTP()">Verify OTP</button>
<p id="otp-message" style="color:#ff00ff;margin-top:5px;"></p>
</div>
<p id="user-message" style="color:#00ff88;margin-top:10px;"></p>
</section>

<!-- TRACK ORDER -->
<section id="track-order-section" class="section">
<h2>Track Order</h2>
<input id="track-order" placeholder="Order ID">
<button class="btn" onclick="trackOrder()">Track</button>
<div id="track-result" style="margin-top:10px;color:#00ff88;"></div>
</section>

<!-- CART PANEL -->
<div class="cart-panel" id="cart-panel">
<h3>Your Cart</h3>
<div id="cart-items"></div>
<p id="empty-msg" style="text-align:center;">Cart is empty</p>
<div class="cart-total" id="cart-total">Total: R0</div>
<button class="btn" onclick="showCheckout()">Checkout</button>
<div class="checkout-form" id="checkout-form">
<button class="btn back-btn" onclick="document.getElementById('checkout-form').style.display='none'">⬅ Back</button>
<input type="text" id="name" placeholder="Full Name" required>
<input type="email" id="email" placeholder="Email" required>
<input type="text" id="phone" placeholder="Phone Number" required>
<input type="text" id="address" placeholder="Delivery Address" required>
<button class="btn" onclick="completeOrder()">Place Order</button>
</div>
</div>

<script>
// ===== PRODUCT DATA =====
const categoriesData={
"Food":[
{name:"Meatybones",image:"images/Meatybones.jpg",price:260,newItem:true},
{name:"Braai Beef",image:"images/Braii_Beef.jpg",price:170},
{name:"Burger Pats",image:"images/Burger_Pats.jpg",price:100},
{name:"Boerewors",image:"images/wors.jpg",price:110},
{name:"Chakalaka Frozen Wors",image:"images/Frozen_Wors.jpg",price:300,newItem:true},
{name:"Combo + free extra cheese",image:"images/Combo.jpg",price:450,newItem:true},
{name:"Russians",image:"images/Russians.jpg",price:250,newItem:true}
],
"Clothes":[
{name:"Neon Hoodie",image:"images/hoodie.jpg",price:450},
{name:"Street Cap",image:"images/cap.jpg",price:180}
],
"Products":[
{name:"Shop Pills",image:"images/pills.jpg",page:"pills"},
{name:"Shop Perfumes",image:"images/perfume.jpg",page:"perfumes"}
]
};

const pillsProducts=[
"DEPRESSION & STRESS COMBO",
"DIABETES COMBO",
"COLD AND FLU",
"ASTHMA & TB COMBO",
"SINUS COMBO",
"SKIN AND ECZEMA COMBO",
"SEXUAL ENHANCEMENT COMBO",
"FERTILITY COMBO",
"BLOOD PRESSURE COMBO",
"HEART COMBO",
"KIDNEY & BLADDER COMBO",
"ARTHRITIS COMBO",
"EYE COMBO",
"ULCERS & PILES COMBO",
"VEINS COMBO",
"STROKE COMBO",
"FIBROIDS AND GENERAL FEMALE HEALTH COMBO",
"TOO MUCH ACID, GALL STONES COMBO"
];

const perfumesProducts=[
{name:"Men's Fragrance",image:"images/perfume1.jpg",price:350},
{name:"Women's Fragrance",image:"images/perfume2.jpg",price:370}
];

// ===== CART & USERS =====
let cart = JSON.parse(localStorage.getItem("cart"))||{};
let users = JSON.parse(localStorage.getItem("users"))||{};
let orders = JSON.parse(localStorage.getItem("orders"))||{};
let pendingSignup = {};
let flyLock=false;

function saveCart(){ localStorage.setItem("cart",JSON.stringify(cart)); }

// ===== INIT =====
document.addEventListener("DOMContentLoaded", ()=>{
  const container=document.getElementById('categories-container');
  Object.keys(categoriesData).forEach(cat=>{
    const div=document.createElement('div');
    div.className='card';
    div.innerHTML=`<h3>${cat}</h3><button class="btn" onclick="showCategoryItems('${cat}')">Shop ${cat}</button>`;
    container.appendChild(div);
  });
  generatePills();
  generatePerfumes();
  updateCartUI();
});

// ===== GENERATE PILLS =====
function generatePills(){
  const container=document.getElementById("pills-container");
  pillsProducts.forEach(name=>{
    const fileName=name.replace(/ /g,"_").replace(/,/g,"").replace(/&/g,"_&_")+".png";
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`<img src="images/${fileName}"><h3>${name}</h3><p>R220</p><button class="btn" onclick="flyToCartSingle(this,'${name}',220)">Add to Cart</button>`;
    container.appendChild(div);
  });
}

// ===== GENERATE PERFUMES =====
function generatePerfumes(){
  const container=document.getElementById("perfume-container");
  perfumesProducts.forEach(item=>{
    const div=document.createElement("div");
    div.className="card";
    div.innerHTML=`<img src="${item.image}"><h3>${item.name}</h3><p>R${item.price}</p><button class="btn" onclick="flyToCartSingle(this,'${item.name}',${item.price})">Add to Cart</button>`;
    container.appendChild(div);
  });
}

// ===== SHOW CATEGORY ITEMS =====
function showCategoryItems(category){
  showSection('category-items');
  document.getElementById('category-title').textContent=category;
  const container=document.getElementById('items-container');
  container.innerHTML='';
  categoriesData[category].forEach(item=>{
    const div=document.createElement('div');
    div.className='card'+(item.newItem?' new-item':'');
    if(item.page){
      div.innerHTML=`<img src="${item.image}"><h3>${item.name}</h3><button class="btn" onclick="openSubPage('${item.page}')">Open Shop</button>`;
    }else{
      div.innerHTML=`<img src="${item.image}"><h3>${item.name}</h3><p>R${item.price}</p><button class="btn" onclick="flyToCartSingle(this,'${item.name}',${item.price})">Add to Cart</button>`;
    }
    container.appendChild(div);
  });
}

function openSubPage(page){
  if(page==="pills") showSection("pills-shop");
  if(page==="perfumes") showSection("perfume-shop");
}

// ===== SECTION TOGGLE =====
function showSection(id){
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ===== CART FUNCTIONS =====
function addToCart(name,price){
  if(cart[name]) cart[name].quantity++;
  else cart[name]={price,quantity:1};
  saveCart();
  updateCartUI();
  const countEl=document.getElementById("cart-count");
  countEl.classList.remove("pop"); void countEl.offsetWidth; countEl.classList.add("pop");
}

function removeFromCart(name){
  if(cart[name]){
    cart[name].quantity--;
    if(cart[name].quantity<=0) delete cart[name];
    saveCart();
    updateCartUI();
  }
}

function updateCartUI(){
  let total=0,count=0;
  const cartItems=document.getElementById("cart-items");
  cartItems.innerHTML="";
  for(let item in cart){
    count+=cart[item].quantity;
    let itemTotal=cart[item].price*cart[item].quantity;
    total+=itemTotal;
    cartItems.innerHTML+=`<div class="cart-item"><span>${item}</span><div><button onclick="removeFromCart('${item}')">-</button>${cart[item].quantity}<button onclick="addToCart('${item}', ${cart[item].price})">+</button></div><span>R${itemTotal}</span></div>`;
  }
  document.getElementById("cart-count").textContent=count;
  document.getElementById("cart-total").textContent="Total: R"+total;
  document.getElementById("empty-msg").style.display=count===0?"block":"none";
}

// ===== FLY TO CART ANIMATION =====
function flyToCartSingle(button,item,price){
  if(flyLock) return; flyLock=true;
  const img=button.parentElement.querySelector('img');
  const fly=document.createElement('img');
  fly.src=img.src;
  fly.className='flying-img';
  document.body.appendChild(fly);
  const imgRect=img.getBoundingClientRect();
  fly.style.top=imgRect.top+'px';
  fly.style.left=imgRect.left+'px';
  const cartRect=document.getElementById("cart-icon").getBoundingClientRect();
  const duration=1200;
  const start=performance.now();
  const startX=imgRect.left, startY=imgRect.top;
  const endX=cartRect.left, endY=cartRect.top;
  const controlX=(startX+endX)/2, controlY=startY-150;
  function animate(time){
    let t=(time-start)/duration; if(t>1) t=1;
    const x=(1-t)*(1-t)*startX+2*(1-t)*t*controlX+t*t*endX;
    const y=(1-t)*(1-t)*startY+2*(1-t)*t*controlY+t*t*endY;
    fly.style.transform=`translate(${x-startX}px,${y-startY}px) scale(${1-0.9*t})`;
    fly.style.opacity=1-t;
    if(t<1) requestAnimationFrame(animate);
    else { addToCart(item,price); fly.remove(); flyLock=false; }
  }
  requestAnimationFrame(animate);
}

// ===== CART PANEL TOGGLE =====
document.getElementById("cart-icon").addEventListener("click",()=>{
  document.getElementById("cart-panel").classList.toggle("open");
});

// ===== SHOW CHECKOUT =====
function showCheckout(){
  if(Object.keys(cart).length === 0){
    alert("Cart is empty!");
    return;
  }
  document.getElementById("checkout-form").style.display = "block";
}

// ===== COMPLETE ORDER =====
function completeOrder(){
  const name = document.getElementById("name").value.trim();
  const email = document.getElementById("email").value.trim();
  const phone = document.getElementById("phone").value.trim();
  const address = document.getElementById("address").value.trim();

  if(!name || !email || !phone || !address){
    alert("Please fill all fields!");
    return;
  }

  if(Object.keys(cart).length === 0){
    alert("Cart is empty!");
    return;
  }

  // Generate unique order ID
  const orderId = 'ORD-' + Date.now() + '-' + Math.floor(Math.random()*1000);

  // Save order to localStorage
  orders = JSON.parse(localStorage.getItem("orders")) || {}; // refresh in case new order added elsewhere
  orders[orderId] = {
    items: {...cart},
    total: Object.values(cart).reduce((sum, i)=>sum + i.price*i.quantity, 0),
    name, email, phone, address,
    date: new Date().toLocaleString()
  };
  localStorage.setItem("orders", JSON.stringify(orders));

  alert(`Order placed successfully!\nOrder ID: ${orderId}\nThank you for shopping with SbheneCart!`);

  // Reset cart
  cart = {};
  saveCart();
  updateCartUI();

  // Hide checkout
  document.getElementById("checkout-form").style.display="none";
  document.getElementById("cart-panel").classList.remove("open");

  // Optional: navigate back to home
  showSection('home');
}

// ===== LOGIN / SIGNUP WITH OTP =====
function startSignup(){
  const username = document.getElementById("signup-username").value.trim();
  const email = document.getElementById("signup-email").value.trim();
  const password = document.getElementById("signup-password").value.trim();
  if(!username || !email || !password){ alert("Fill all signup fields"); return; }
  if(users[username]){ alert("Username already exists"); return; }

  // Generate 6-digit OTP
  const otp = Math.floor(100000 + Math.random()*900000);
  pendingSignup = {username,email,password,otp};
  document.getElementById("otp-verification").style.display="block";
  document.getElementById("otp-message").textContent = `OTP sent to ${email} (Simulated: ${otp})`;
}

function verifyOTP(){
  const entered = document.getElementById("otp-input").value.trim();
  if(entered == pendingSignup.otp){
    users[pendingSignup.username] = {
      email: pendingSignup.email,
      password: pendingSignup.password
    };
    localStorage.setItem("users", JSON.stringify(users));
    document.getElementById("user-message").textContent = "Signup successful! You can now login.";
    document.getElementById("otp-verification").style.display="none";
    pendingSignup = {};
  } else {
    document.getElementById("otp-message").textContent = "Incorrect OTP, try again.";
  }
}

function loginUser(){
  const username = document.getElementById("login-username").value.trim();
  const password = document.getElementById("login-password").value.trim();
  if(users[username] && users[username].password === password){
    document.getElementById("user-message").textContent = `Welcome back, ${username}!`;
    showSection('home');
  } else {
    document.getElementById("user-message").textContent = "Invalid login credentials.";
  }
}

// ===== TRACK ORDER =====
function trackOrder(){
  const id = document.getElementById("track-order").value.trim();
  const result = document.getElementById("track-result");
  orders = JSON.parse(localStorage.getItem("orders")) || {}; // refresh from storage
  if(orders[id]){
    const o = orders[id];
    result.innerHTML = `
      <p><b>Order ID:</b> ${id}</p>
      <p><b>Name:</b> ${o.name}</p>
      <p><b>Email:</b> ${o.email}</p>
      <p><b>Phone:</b> ${o.phone}</p>
      <p><b>Address:</b> ${o.address}</p>
      <p><b>Total:</b> R${o.total}</p>
      <p><b>Date:</b> ${o.date}</p>
      <p><b>Items:</b></p>
      <ul>${Object.keys(o.items).map(i=>`<li>${i} x ${o.items[i].quantity}</li>`).join('')}</ul>
    `;
  } else {
    result.textContent = "Order ID not found.";
  }
}

// ===== MENU TOGGLE =====
function toggleMenu(){
  const menu = document.getElementById("menu");
  menu.style.display = (menu.style.display === "flex") ? "none" : "flex";
  menu.style.flexDirection = "column";
}
</script>
</body>
</html>
