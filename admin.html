<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SbheneCart Admin Pro</title>
<style>
body{margin:0;font-family:Arial;background:#111;color:#0f8}header{background:#000;padding:15px;border-bottom:2px solid #0f8}
nav{display:flex;gap:8px;flex-wrap:wrap;padding:10px;background:#181818}nav button{padding:8px}
.page{display:none;padding:20px}.active{display:block}.card{border:1px solid #0f8;padding:12px;margin:10px 0;background:#1a1a1a}
input,select,textarea{width:100%;margin:5px 0;padding:8px}
</style></head><body>
<header><h2>SbheneCart Admin Pro</h2></header>
<nav>
<button onclick="show('dash')">Dashboard</button>
<button onclick="show('products')">Products</button>
<button onclick="show('categories')">Categories</button>
<button onclick="show('orders')">Orders</button>
<button onclick="show('users')">Users</button>
<button onclick="show('coupons')">Coupons</button>
<button onclick="show('reports')">Reports</button>
<button onclick="show('settings')">Settings</button>
</nav>

<section id="dash" class="page active"><div class="card"><div id="stats"></div></div></section>

<section id="products" class="page">
<div class="card">
<input id="pn" placeholder="Name"><input id="pp" type="number" placeholder="Price">
<input id="pi" type="file" accept="image/*"><select id="pc"></select>
<input id="ps" type="number" placeholder="Stock"><textarea id="pd" placeholder="Description"></textarea>
<button onclick="saveProduct()">Save Product</button>
</div><div id="plist"></div></section>

<section id="categories" class="page"><div class="card">
<input id="newCat" placeholder="Category"><button onclick="addCat()">Add Category</button><div id="cats"></div></div></section>

<section id="orders" class="page"><div class="card"><div id="olist"></div></div></section>
<section id="users" class="page"><div class="card"><div id="ulist"></div></div></section>
<section id="coupons" class="page"><div class="card">Coupon manager placeholder (ready for expansion).</div></section>
<section id="reports" class="page"><div class="card">Sales, inventory and revenue reports placeholder.</div></section>
<section id="settings" class="page"><div class="card"><input id="pw" type="password" placeholder="New admin password"><button onclick="cpw()">Save Password</button></div></section>

<script>
let admin=JSON.parse(localStorage.admin||'{"username":"admin","password":"1234"}');
let cats=JSON.parse(localStorage.categories||'["Food"]');
let products=JSON.parse(localStorage.products||'[]');
let edit=-1,imgData="";
function show(id){document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));document.getElementById(id).classList.add('active');refresh();}
pi.onchange=()=>{let f=pi.files[0];if(!f)return;let r=new FileReader();r.onload=e=>imgData=e.target.result;r.readAsDataURL(f);}
function addCat(){if(newCat.value&&!cats.includes(newCat.value)){cats.push(newCat.value);localStorage.categories=JSON.stringify(cats);newCat.value='';refresh();}}
function saveProduct(){let done=()=>{let p={id:edit<0?Date.now():products[edit].id,name:pn.value,price:+pp.value,image:imgData||products[edit]?.image||"",category:pc.value,stock:+ps.value,description:pd.value};if(edit<0)products.push(p);else products[edit]=p;localStorage.products=JSON.stringify(products);edit=-1;imgData="";refresh();};
done();}
function editP(i){let p=products[i];edit=i;pn.value=p.name;pp.value=p.price;ps.value=p.stock;pd.value=p.description;pc.value=p.category;show('products');}
function delP(i){products.splice(i,1);localStorage.products=JSON.stringify(products);refresh();}
function cpw(){admin.password=pw.value;localStorage.admin=JSON.stringify(admin);alert('Password updated');}
function status(id,v){let o=JSON.parse(localStorage.orders||'{}');o[id].status=v;localStorage.orders=JSON.stringify(o);}
function refresh(){
pc.innerHTML=cats.map(c=>`<option>${c}</option>`).join('');
cats.innerHTML?0:0;
document.getElementById('cats').innerHTML=cats.map((c,i)=>`<div>${c}</div>`).join('');
plist.innerHTML=products.map((p,i)=>`<div class=card>${p.image?'<img src="'+p.image+'" width=70><br>':''}<b>${p.name}</b><br>R${p.price}<br>${p.category}<br><button onclick='editP(${i})'>Edit</button><button onclick='delP(${i})'>Delete</button></div>`).join('');
let o=JSON.parse(localStorage.orders||'{}');
olist.innerHTML=Object.entries(o).map(([id,x])=>`<div class=card>${id}<br><select onchange="status('${id}',this.value)"><option>Pending</option><option>Processing</option><option>Shipped</option><option>Delivered</option><option>Cancelled</option></select></div>`).join()||'No orders';
let u=JSON.parse(localStorage.users||'{}');ulist.innerHTML=Object.keys(u).join('<br>')||'No users';
stats.innerHTML=`Products: ${products.length}<br>Categories: ${cats.length}<br>Orders: ${Object.keys(o).length}<br>Users: ${Object.keys(u).length}`;
}
refresh();
</script></body></html>
