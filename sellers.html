<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"><title>SbheneCart Seller Console Pro</title>
  <!-- Chart.js CDN for Visual Analytics -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root { --bg:#000; --text:#0f8; --primary:#0f8; --card:#111; }
    body { background:var(--bg); color:var(--text); font-family:Arial, sans-serif; padding:15px; margin:0; animation: fadeIn 0.5s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .card { border:1px solid var(--primary); padding:15px; margin:10px 0; background:var(--card); border-radius:8px; box-shadow: 0 0 10px #0f82; transition: transform 0.3s, box-shadow 0.3s; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 0 20px rgba(0, 255, 136, 0.4); }
    input, select, textarea { width:100%; margin:5px 0; padding:10px; background:#1e1e1e; color:var(--text); border:1px solid var(--primary); border-radius:4px; box-sizing:border-box; transition: 0.2s; }
    input:focus, select:focus, textarea:focus { outline:none; box-shadow: 0 0 8px var(--primary); }
    button { background:var(--primary); color:#000; font-weight:bold; border:0; padding:10px 15px; cursor:pointer; border-radius:4px; transition: 0.3s; }
    button:hover { opacity:0.8; box-shadow: 0 0 12px var(--primary); }
    .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap:15px; }
    #preview { max-width:120px; display:none; border-radius:4px; margin:8px 0; border: 1px solid var(--primary); }
    .chart-container { position: relative; height: 180px; width: 100%; }
  </style>
</head>
<body>
  <h2>🌌 SbheneCart Seller Console Pro</h2>

  <!-- LOGIN PANEL -->
  <div id="login-panel" class="card">
    <h3>Access Dashboard</h3>
    <input type="email" id="email" placeholder="Seller Email">
    <input type="password" id="password" placeholder="Password">
    <button onclick="loginSeller()">Verify & Log In</button>
  </div>

  <!-- WORKSPACE -->
  <div id="seller-wrapper" style="display:none;">
    <button onclick="logoutSeller()" style="float:right; background:#f33; color:#fff;">Lock Console</button>
    <div class="grid">
      <div class="card"><b>Net Earnings (Delivered)</b><br><span id="rev" style="font-size:24px; font-weight:bold;">R0</span></div>
      <div class="card"><b>Awaiting Admin Review</b><br><span id="pending-count" style="font-size:24px; font-weight:bold;">0</span></div>
    </div>

    <!-- SALES ANALYTICS CHART -->
    <div class="card">
      <h3>📈 Dynamic Sales Timeline</h3>
      <div class="chart-container"><canvas id="salesChart"></canvas></div>
    </div>

    <!-- FORM -->
    <div class="card">
      <h3>📤 Publish New Listing (Awaiting Approval)</h3>
      <input id="sp_name" placeholder="Creation Name *">
      <div class="grid">
        <input id="sp_price" type="number" placeholder="Price (ZAR) *">
        <input id="sp_stock" type="number" placeholder="Initial Inventory Quantity" value="10">
      </div>
      <div class="grid">
        <select id="sp_cat" onchange="updateSubcats()"><option value="">Select Category *</option></select>
        <select id="sp_subcat" onchange="updateSubSubcats()"><option value="">Select Subcategory</option></select>
      </div>
      <select id="sp_subsubcat"><option value="">Select Sub-subcategory</option></select>
      
      <div class="grid">
        <select id="sp_sizing"><option value="none">No Sizing Needed</option><option value="clothing">Clothing (XS-XL)</option><option value="shoes">Shoes (EU 36-46)</option></select>
        <div style="display:flex; align-items:center; gap:8px;"><input type="checkbox" id="sp_req" style="width:auto;"><label>Requires Sewing Measurements</label></div>
      </div>

      <input type="file" id="sp_image" accept="image/*" onchange="previewImage(event)">
      <img id="preview">
      <textarea id="sp_desc" placeholder="Product details, material specs, or custom request directions..."></textarea>
      <button id="sub-btn" onclick="submitProduct()">Submit for Approval</button>
    </div>

    <div class="grid">
      <div class="card"><h3>📦 My Inventory Catalog</h3><div id="my-prods"></div></div>
      <div class="card"><h3>🛒 Linked Customer Orders</h3><div id="my-orders"></div></div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
    import { getFirestore, collection, addDoc, updateDoc, doc, onSnapshot, query, where, getDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";

    const config = { apiKey: "AIzaSyC4BCz9GeNTgQYa8ydIJreTREVdPklganA", authDomain: "sbhenecart.firebaseapp.com", projectId: "sbhenecart" };
    const app = initializeApp(config); const db = getFirestore(app); const auth = getAuth(app);
    let sUid = null, uploadedUrl = "", dbSubcats = [], dbSubsubcats = [], salesChart = null;

    window.loginSeller = async () => {
      try {
        const u = await signInWithEmailAndPassword(auth, document.getElementById("email").value, document.getElementById("password").value);
        const docSnap = await getDoc(doc(db, "sellers", u.user.uid));
        if (!docSnap.exists()) { await signOut(auth); alert("Unauthorized access."); }
      } catch (e) { alert(e.message); }
    };
    window.logoutSeller = () => signOut(auth);

    onAuthStateChanged(auth, (u) => {
      document.getElementById("login-panel").style.display = u ? "none" : "block";
      document.getElementById("seller-wrapper").style.display = u ? "block" : "none";
      if (u) { sUid = u.uid; loadDashboard(); }
    });

    window.previewImage = (e) => {
      const f = e.target.files[0];
      if (f) {
        const reader = new FileReader();
        reader.onload = (ev) => { const img = document.getElementById("preview"); img.src = ev.target.result; img.style.display = "block"; };
        reader.readAsDataURL(f);
      }
    };

    window.submitProduct = async () => {
      const name = document.getElementById("sp_name").value.trim();
      const price = document.getElementById("sp_price").value.trim();
      const cat = document.getElementById("sp_cat").value;
      const file = document.getElementById("sp_image").files[0];

      if (!name || !price || !cat || !file) return alert("Please fill all required fields and upload an image preview.");

      const btn = document.getElementById("sub-btn");
      btn.innerText = "Publishing..."; btn.disabled = true;

      try {
        const form = new FormData();
        form.append("file", file); form.append("upload_preset", "SbheneCart");
        const resp = await fetch("https://api.cloudinary.com/v1_1/qocn8gjn/image/upload", { method: "POST", body: form });
        const data = await resp.json();
        uploadedUrl = data.secure_url;

        await addDoc(collection(db, "products"), {
          name, price: Number(price), category: cat,
          subcategory: document.getElementById("sp_subcat").value || "",
          subsubcategory: document.getElementById("sp_subsubcat").value || "",
          sizingType: document.getElementById("sp_sizing").value,
          requiresMeasurements: document.getElementById("sp_req").checked,
          stock: Number(document.getElementById("sp_stock").value) || 10,
          description: document.getElementById("sp_desc").value,
          image: uploadedUrl, images: [uploadedUrl],
          sellerId: sUid, approved: false, visible: true, timestamp: Date.now()
        });

        alert("Uploaded! Awaiting review.");
        document.getElementById("sp_name").value = "";
        document.getElementById("sp_price").value = "";
        document.getElementById("sp_desc").value = "";
        document.getElementById("sp_image").value = "";
        document.getElementById("preview").style.display = "none";
      } catch (err) { alert(err.message); }
      finally { btn.innerText = "Submit for Approval"; btn.disabled = false; }
    };

    window.updateSubcats = () => {
      const cat = document.getElementById("sp_cat").value;
      document.getElementById("sp_subcat").innerHTML = '<option value="">Select Subcategory</option>' + 
        dbSubcats.filter(s => s.category === cat).map(s => `<option value="${s.name}">${s.name}</option>`).join('');
    };

    window.updateSubSubcats = () => {
      const sub = document.getElementById("sp_subcat").value;
      document.getElementById("sp_subsubcat").innerHTML = '<option value="">Select Sub-subcategory</option>' + 
        dbSubsubcats.filter(s => s.subcategory === sub).map(s => `<option value="${s.name}">${s.name}</option>`).join('');
    };

    function renderSalesChart(dailySales) {
      const ctx = document.getElementById("salesChart").getContext("2d");
      if (salesChart) salesChart.destroy();
      
      const dates = Object.keys(dailySales).slice(-7);
      const dataValues = dates.map(d => dailySales[d]);

      salesChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: dates,
          datasets: [{
            label: 'Sales (ZAR)',
            data: dataValues,
            borderColor: '#0f8',
            backgroundColor: 'rgba(0, 255, 136, 0.05)',
            borderWidth: 2,
            tension: 0.3,
            fill: true
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            x: { grid: { display: false }, ticks: { color: '#0f8' } },
            y: { grid: { color: '#222' }, ticks: { color: '#0f8' } }
          }
        }
      });
    }

    function loadDashboard() {
      onSnapshot(collection(db, "categories"), (snap) => {
        document.getElementById("sp_cat").innerHTML = '<option value="">Select Category *</option>' + 
          snap.docs.map(d => `<option value="${d.data().name}">${d.data().name}</option>`).join('');
      });
      onSnapshot(collection(db, "subcategories"), snap => dbSubcats = snap.docs.map(d => d.data()));
      onSnapshot(collection(db, "subsubcategories"), snap => dbSubsubcats = snap.docs.map(d => d.data()));

      onSnapshot(query(collection(db, "products"), where("sellerId", "==", sUid)), (snap) => {
        const list = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        document.getElementById("pending-count").innerText = list.filter(p => !p.approved).length;
        document.getElementById("my-prods").innerHTML = list.map(p => `
          <div class="card">
            <b>${p.name}</b> (${p.approved ? "✅ Approved" : "⏳ Review"})<br>
            Price (ZAR): <input type="number" id="pr-${p.id}" value="${p.price}" style="width:100px; display:inline;">
            Stock: <input type="number" id="st-${p.id}" value="${p.stock}" style="width:80px; display:inline;"><br><br>
            <button onclick="saveInventory('${p.id}')">Save Changes</button>
          </div>
        `).join('');
      });

      onSnapshot(collection(db, "orders"), (snap) => {
        const orders = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        const filtered = orders.filter(o => o.items && o.items.some(i => i.sellerId === sUid));
        
        let revenue = 0;
        const dailySales = {};

        filtered.forEach(o => {
          if (o.status === "Delivered") {
            const date = o.timestamp ? new Date(o.timestamp).toLocaleDateString() : "Delivered";
            let orderTotal = 0;
            o.items.filter(i => i.sellerId === sUid).forEach(i => {
              const itemRev = i.price * i.quantity;
              revenue += itemRev;
              orderTotal += itemRev;
            });
            dailySales[date] = (dailySales[date] || 0) + orderTotal;
          }
        });

        document.getElementById("rev").innerText = "R" + revenue;
        renderSalesChart(dailySales);

        document.getElementById("my-orders").innerHTML = filtered.map(o => `
          <div class="card">
            <b>Order #${o.id.substring(0,6)}</b> (${o.status})<br>
            Buyer: ${o.customer?.name || "Client"} | Phone: ${o.customer?.phone || ""}<br>
            ${o.items.filter(i => i.sellerId === sUid).map(i => `• ${i.name} (x${i.quantity})`).join('<br>')}
          </div>
        `).join('');
      });
    }

    window.saveInventory = async (id) => {
      await updateDoc(doc(db, "products", id), {
        price: Number(document.getElementById("pr-" + id).value),
        stock: Number(document.getElementById("st-" + id).value)
      });
      alert("Inventory Saved!");
    };
  </script>
</body>
</html>
