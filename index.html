<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>SbheneCart</title>
<style>
body{font-family:Arial;background:#000;color:#0f8;margin:0}header{padding:15px;border-bottom:1px solid #0f8;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;padding:20px}
.card{background:#111;border:1px solid #0f8;padding:15px;border-radius:8px}
button{background:#0f8;border:0;padding:8px 12px;cursor:pointer}
</style></head><body>
<header><h2>SbheneCart</h2><button onclick="location.href='admin.html'">Admin</button></header>
<div class="grid" id="products"></div>
<script>
const products=JSON.parse(localStorage.getItem('products')||'[]');
const box=document.getElementById('products');
box.innerHTML=products.length?products.map(p=>`<div class="card"><h3>${p.name}</h3><button>View</button></div>`).join(''):'<p style="padding:20px">No products yet.</p>';
</script></body></html>
